# UI-facing interview options, loaded at runtime by
# apps/agent/src/deepinterview_agent/core/ui_config.py. Nothing here is
# hardcoded in Python: the GET /api/config/ui endpoint, the STT language gate
# in the prep route, and the difficulty clamps in the live interviewer all read
# this file. Override its location with UI_CONFIG_PATH (absolute or
# app-cwd-relative).

[languages]
# Languages offered to the candidate picker in the UI.
offered = ["en", "vi", "es", "zh", "hi", "id", "pt", "fr", "de", "ja"]
# Languages the configured STT model can actually transcribe. The local
# parakeet-tdt_ctc-110m server is English-only; widen this when the STT
# deployment changes (e.g. Deepgram nova-2 covers the rest).
stt_supported = ["en"]

[voices.en]
default = "alba"
# pocket-tts built-in voices (all English). ids are passed through to
# `pocket-tts serve` verbatim.
[[voices.en.options]]
id = "alba"
label = "Alba"
[[voices.en.options]]
id = "mariam"
label = "Mariam"
[[voices.en.options]]
id = "jannah"
label = "Jannah"
[[voices.en.options]]
id = "damoz"
label = "Damoz"

[voices.fr]
default = "estelle"
[[voices.fr.options]]
id = "estelle"
label = "Estelle"

[voices.de]
default = "juergen"
[[voices.de.options]]
id = "juergen"
label = "Juergen"

[voices.pt]
default = "rafael"
[[voices.pt.options]]
id = "rafael"
label = "Rafael"

[voices.es]
default = "lola"
[[voices.es.options]]
id = "lola"
label = "Lola"

[voices.it]
default = "giovanni"
[[voices.it.options]]
id = "giovanni"
label = "Giovanni"

[difficulties]
levels = ["easy", "medium", "hard"]
# Upper clamp applied to the live 1-5 question-difficulty band per level, so
# "easy" never escalates past rung 2 even when adaptive logic suggests harder.
clamps = { easy = 2, medium = 3, hard = 4 }
